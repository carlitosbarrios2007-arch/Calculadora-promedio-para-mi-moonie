<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Notas | My Moonie 🌙</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#5b21b6,#7c3aed,#a855f7);
    overflow:hidden;
    position:relative;
}
/* Fondo decorativo */
.estrellas{
    position:absolute;
    inset:0;
    pointer-events:none;
    color:rgba(255,255,255,.18);
    font-size:22px;
}
.estrellas span{
    position:absolute;
}
.e1{top:5%;left:8%;}
.e2{top:12%;left:25%;}
.e3{top:7%;right:18%;}
.e4{top:20%;right:8%;}
.e5{top:32%;left:5%;}
.e6{top:40%;right:15%;}
.e7{top:55%;left:10%;}
.e8{top:65%;right:7%;}
.e9{bottom:18%;left:15%;}
.e10{bottom:8%;right:22%;}
.e11{top:15%;left:50%;}
.e12{bottom:30%;left:40%;}
.l1{top:10%;right:30%;font-size:45px;}
.l2{bottom:12%;left:25%;font-size:50px;}
.l3{top:55%;right:35%;font-size:40px;}
.l4{top:28%;left:20%;font-size:35px;}
.card{
    width:100%;
    max-width:520px;
    background:rgba(255,255,255,0.97);
    border-radius:28px;
    padding:32px;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
    position:relative;
    z-index:2;
}
h1{
    text-align:center;
    color:#6d28d9;
    margin-bottom:8px;
    font-size:2rem;
}
.subtitulo{
    text-align:center;
    color:#7c3aed;
    margin-bottom:28px;
    font-size:0.95rem;
    letter-spacing:1px;
}
.input-group{
    margin-bottom:16px;
}
label{
    display:block;
    margin-bottom:6px;
    color:#4b5563;
    font-weight:600;
}
input{
    width:100%;
    padding:13px;
    border:2px solid #ddd6fe;
    border-radius:14px;
    font-size:16px;
    transition:.3s;
}
input:focus{
    outline:none;
    border-color:#7c3aed;
    box-shadow:0 0 10px rgba(124,58,237,.2);
}
button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}
button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(124,58,237,.3);
}
.resultado{
    margin-top:20px;
    padding:20px;
    border-radius:18px;
    display:none;
    text-align:center;
}
.ok{
    background:#f5f3ff;
    color:#4c1d95;
    border:1px solid #ddd6fe;
}
.error{
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}
.nota{
    font-size:52px;
    font-weight:700;
    margin:12px 0;
    color:#6d28d9;
}
</style>
</head>
<body>
<div class="estrellas">
<span class="e1">✦</span>
<span class="e2">✧</span>
<span class="e3">✦</span>
<span class="e4">✧</span>
<span class="e5">✦</span>
<span class="e6">✧</span>
<span class="e7">✦</span>
<span class="e8">✧</span>
<span class="e9">✦</span>
<span class="e10">✧</span>
<span class="e11">✦</span>
<span class="e12">✧</span>

☾
☾
☽
☾

</div>
<div class="card">
<h1>🌙 My Moonie</h1>
<p class="subtitulo">
Calculadora de Notas
</p>
<div class="input-group">
<label>Primer corte (30%)</label>
<input type="number" id="n1" min="0" max="5" step="0.01" placeholder="Ej: 4.2">
</div>
<div class="input-group">
<label>Segundo corte (40%)</label>
<input type="number" id="n2" min="0" max="5" step="0.01" placeholder="Ej: 3.8">
</div>
<div class="input-group">
<label>Promedio final deseado</label>
<input type="number" id="meta" min="0" max="5" step="0.01" placeholder="Ej: 4.0">
</div>
<button onclick="calcular()">
Calcular nota necesaria
</button>
<div id="resultado" class="resultado"></div>
</div>
<script>
function calcular(){
const n1 = parseFloat(document.getElementById("n1").value);
const n2 = parseFloat(document.getElementById("n2").value);
const meta = parseFloat(document.getElementById("meta").value);
const resultado = document.getElementById("resultado");
if(isNaN(n1) || isNaN(n2) || isNaN(meta)){
    resultado.style.display = "block";
    resultado.className = "resultado error";
    resultado.innerHTML = `
        <h3>Datos incompletos</h3>
        <p>Ingresa todas las notas para realizar el cálculo.</p>
    `;
    return;
}
const acumulado = (n1 * 0.30) + (n2 * 0.40);
const necesaria = (meta - acumulado) / 0.30;
resultado.style.display = "block";
if(necesaria > 5){
    resultado.className = "resultado error";
    resultado.innerHTML = `
        <h3>Objetivo difícil</h3>
        <p>La nota que necesitas es:</p>
        <div class="nota">${necesaria.toFixed(2)}</div>
        <p>Supera la nota máxima permitida (5.0).</p>
    `;
}
else if(necesaria <= 0){
    resultado.className = "resultado ok";
    resultado.innerHTML = `
        <h3>🎉 Objetivo alcanzado</h3>
        <p>Ya tienes ese promedio asegurado, Moonie 🌙</p>
    `;
}
else{
    resultado.className = "resultado ok";
    let mensaje;
    if(necesaria <= 2){
        mensaje = "Vas bien amor ❤️";
    }
    else if(necesaria <= 3.5){
        mensaje = "Tú puedes reinota 🌙";
    }
    else if(necesaria <= 4.5){
        mensaje = "Ta duro, pero tú puedes mi amor";
    }
    else{
        mensaje = "Dale amor, te irá bien ✨";
    }
    resultado.innerHTML = `
        <h3>${mensaje}</h3>
        <p>Necesitas un:</p>
        <div class="nota">${necesaria.toFixed(2)}</div>
        <p>en el tercer corte para terminar con un promedio de ${meta.toFixed(2)}.</p>
    `;
}
}
</script>
</body>
</html>
