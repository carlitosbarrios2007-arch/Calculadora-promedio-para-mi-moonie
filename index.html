<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator | My Moonie</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#5b21b6,#7c3aed,#a855f7);
}
.card{
    width:100%;
    max-width:520px;
    background:rgba(255,255,255,0.97);
    border-radius:28px;
    padding:32px;
    box-shadow:0 25px 60px rgba(91,33,182,.35);
    border:1px solid rgba(168,85,247,.25);
}
h1{
    text-align:center;
    color:#6d28d9;
    margin-bottom:8px;
    font-size:2rem;
}
.subtitulo{
    text-align:center;
    color:#8b5cf6;
    margin-bottom:8px;
    font-size:0.95rem;
    letter-spacing:2px;
    font-weight:600;
}
.moonie{
    text-align:center;
    color:#a855f7;
    margin-bottom:24px;
    font-size:1rem;
}
.input-group{
    margin-bottom:16px;
}
label{
    display:block;
    margin-bottom:6px;
    color:#334155;
    font-weight:600;
}
input{
    width:100%;
    padding:12px;
    border:2px solid #ddd6fe;
    border-radius:14px;
    font-size:16px;
    transition:.3s;
}
input:focus{
    outline:none;
    border-color:#8b5cf6;
}
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 25px rgba(124,58,237,.35);
}
button:hover{
    transform:translateY(-2px);
}
.resultado{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    display:none;
    text-align:center;
}
.ok{
    background:#faf5ff;
    color:#581c87;
    border:1px solid #d8b4fe;
}
.error{
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}
.nota{
    font-size:52px;
    font-weight:800;
    margin:10px 0;
    color:#7c3aed;
}
</style>
</head>
<body>
<div class="card">
<h1>🌙 My Moonie</h1>
<p class="subtitulo">
GRADE CALCULATOR
</p>
<p class="moonie">
✨ Para mi Moonie ✨
</p>
<div class="input-group">
<label>Primer corte (30%)</label>
<input type="number" id="n1" min="0" max="5" step="0.01" placeholder="Ej: 4.2">
</div>
<div class="input-group">
<label>Segundo corte (40%)</label>
<input type="number" id="n2" min="0" max="5" step="0.01" placeholder="Ej: 3.8">
</div>
<div class="input-group">
<label>Promedio final deseado</label>
<input type="number" id="meta" min="0" max="5" step="0.01" placeholder="Ej: 4.0">
</div>
<button onclick="calcular()">
Calcular nota necesaria
</button>
<div id="resultado" class="resultado"></div>
</div>
<script>
function calcular(){
const n1 = parseFloat(document.getElementById("n1").value);
const n2 = parseFloat(document.getElementById("n2").value);
const meta = parseFloat(document.getElementById("meta").value);
const resultado = document.getElementById("resultado");
if(isNaN(n1) || isNaN(n2) || isNaN(meta)){
    resultado.style.display = "block";
    resultado.className = "resultado error";
    resultado.innerHTML = `
        <h3>Datos incompletos</h3>
        <p>Ingresa todas las notas para realizar el cálculo.</p>
    `;
    return;
}
const acumulado = (n1 * 0.30) + (n2 * 0.40);
const necesaria = (meta - acumulado) / 0.30;
resultado.style.display = "block";
if(necesaria > 5){
    resultado.className = "resultado error";
    resultado.innerHTML = `
        <h3>Objetivo difícil</h3>
        <p>La nota que necesitas es:</p>
        <div class="nota">${necesaria.toFixed(2)}</div>
        <p>Supera la nota máxima permitida (5.0).</p>
    `;
}
else if(necesaria <= 0){
    resultado.className = "resultado ok";
    resultado.innerHTML = `
        <h3>🎉 Objetivo alcanzado</h3>
        <p>Ya tienes ese promedio asegurado, Moonie 🌙</p>
    `;
}
else{
    resultado.className = "resultado ok";
    let mensaje;
    if(necesaria <= 2){
        mensaje = "Vas bien amor ❤️";
    }
    else if(necesaria <= 3.5){
        mensaje = "Tú puedes reinota 🌙";
    }
    else if(necesaria <= 4.5){
        mensaje = "Ta duro, pero tu puedes mi amor";
    }
    else{
        mensaje = "Dale amor, te irá bien ✨";
    }
    resultado.innerHTML = `
        <h3>${mensaje}</h3>
        <p>Necesitas un:</p>
        <div class="nota">${necesaria.toFixed(2)}</div>
        <p>en el tercer corte para terminar con un promedio de ${meta.toFixed(2)}.</p>
    `;
}
}
</script>
</body>
</html>
